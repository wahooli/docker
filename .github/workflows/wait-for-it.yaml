name: wait-for-it

on:
  push:
    branches:
    - main
    paths:
    - wait-for-it/**
    - .github/workflows/wait-for-it.yaml
    - .github/workflows/build-image.yaml
    - .github/scripts/plan-release.sh
  pull_request:
    paths:
    - wait-for-it/**
    - .github/workflows/wait-for-it.yaml
    - .github/workflows/build-image.yaml
    - .github/scripts/plan-release.sh
  workflow_dispatch:
    inputs:
      force:
        description: Overwrite the tag in VERSION if it already exists
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      image: wait-for-it
      context: wait-for-it
      latest: true
      force: ${{ inputs.force == true }}
