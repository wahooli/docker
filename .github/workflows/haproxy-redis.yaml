name: haproxy-redis

on:
  push:
    branches:
    - main
    paths:
    - haproxy-redis/**
    - .github/workflows/haproxy-redis.yaml
    - .github/workflows/build-image.yaml
    - .github/scripts/plan-release.sh
  pull_request:
    paths:
    - haproxy-redis/**
    - .github/workflows/haproxy-redis.yaml
    - .github/workflows/build-image.yaml
    - .github/scripts/plan-release.sh
  schedule:
  - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Publish a new tag even if nothing changed
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    with:
      image: haproxy-redis
      context: haproxy-redis
      upstream-env: HAPROXY_VERSION
      force: ${{ inputs.force == true }}
